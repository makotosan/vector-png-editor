name: Core tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cairo on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Cairo on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Cairo on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo
      - name: Configure Windows Cairo directory
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '"VECTOR_PNG_CAIRO_DIR=$env:MSYS2_LOCATION\ucrt64\bin" >> $env:GITHUB_ENV'
      - run: python -m pip install './packages/core[test]' build
      - name: Test parser, CLI, extraction and real rendering
        working-directory: packages/core
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build packages/core --outdir dist
      - name: Test TypeScript bridge and real managed venv lifecycle
        run: python tools/check_environment_manager.py dist
      - name: Test wheel outside source tree
        run: python tools/check_core_wheel.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
  core-check:
    name: core-check
    if: always()
    needs: core
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix cell to pass
        env:
          RESULT: ${{ needs.core.result }}
        run: test "$RESULT" = success
