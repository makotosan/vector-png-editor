name: TS Core tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and test the TypeScript Core
        working-directory: packages/ts-core
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
  core-check:
    name: core-check
    if: always()
    needs: core
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix cell to pass
        env:
          RESULT: ${{ needs.core.result }}
        run: test "$RESULT" = success
