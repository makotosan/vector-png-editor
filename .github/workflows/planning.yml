name: Planning checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  planning-check:
    name: planning-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/check_planning.py

