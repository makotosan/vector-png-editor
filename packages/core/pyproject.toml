[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-png-editor-core"
version = "0.1.0.dev1"
description = "Shared source-preserving Core and CLI for vector-png Editor"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["Pillow==13.0.0", "CairoSVG==2.9.1", "defusedxml==0.7.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
vector-png-editor = "vector_png_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
